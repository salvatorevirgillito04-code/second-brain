<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Second Brain</title>
<style>
/* Layout: barra superiore, contenuto scorrevole, navigazione in basso a portata di pollice, pulsante + per l'aggiunta rapida. Tema scuro. */
:root{
  color-scheme:dark;
  --bg:#04050f; --pannello:rgba(16,19,46,.62); --rilievo:rgba(30,34,78,.72); --linea:rgba(129,140,255,.16);
  --testo:#e9ecff; --tenue:#98a0c8; --accento:#9b8cff; --accento2:#5ad1ff; --accento-tenue:rgba(124,108,255,.18); --su-accento:#0b0a1f;
  --inbox:#ff7eb6; --progetto:#b38cff; --area:#4fe3c1; --risorsa:#ffc46b; --archivio:#7d86b0; --stanza:#5ad1ff;
  --ok:#5ff0a8; --att:#ffb85c; --err:#ff6b8b;
  --alone:0 0 0 1px rgba(155,140,255,.10),0 8px 30px rgba(10,8,40,.55);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --m:ui-monospace,"Roboto Mono",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--testo);font-family:var(--f);font-size:15px;line-height:1.45}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--linea)}
.top .in{max-width:640px;margin:0 auto;padding:10px 12px 8px 16px;display:flex;align-items:center;gap:6px}
.top h1{font-size:1.15rem;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:42px;height:42px;border-radius:10px;border:none;background:transparent;color:var(--tenue);display:grid;place-items:center;cursor:pointer;flex:0 0 42px}
.ico svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:14px 16px 150px;display:grid;gap:18px;align-content:start}
h2{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);margin:0 0 8px;font-weight:600}
p{margin:0}
.muted{color:var(--tenue)} .small{font-size:.84rem} .mono{font-family:var(--m);font-size:.78rem;overflow-wrap:anywhere}
.cerca{display:flex;align-items:center;gap:8px;background:var(--rilievo);border:1px solid var(--linea);border-radius:12px;padding:0 12px}
.cerca svg{width:18px;height:18px;stroke:var(--tenue);fill:none;stroke-width:2;flex:0 0 18px}
.cerca input{flex:1;background:transparent;border:none;color:var(--testo);font:inherit;padding:12px 0;outline:none;min-width:0}
.rapidi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rapido{background:var(--pannello);border:1px solid var(--linea);border-radius:12px;padding:12px 6px;color:var(--testo);font:inherit;font-size:.82rem;display:grid;gap:2px;justify-items:center;text-align:center;cursor:pointer}
.rapido b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.lista{display:grid;gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.riga{background:var(--pannello);padding:12px 14px;display:flex;gap:12px;align-items:center;min-width:0;border:none;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer}
.riga:active{background:var(--rilievo)}
.riga .t{flex:1;min-width:0}
.riga .t b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga .t span{font-size:.8rem;color:var(--tenue)}
.vuoto{background:var(--pannello);padding:14px;color:var(--tenue);font-size:.88rem}
.punto{width:10px;height:10px;border-radius:50%;flex:0 0 10px;display:inline-block}
.quadro{width:10px;height:10px;border-radius:3px;flex:0 0 10px;display:inline-block}
.conta{font-size:.8rem;color:var(--tenue);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font-size:.74rem;padding:2px 9px;border-radius:999px;background:var(--rilievo);color:var(--tenue);border:1px solid var(--linea);white-space:nowrap}
button.chip{cursor:pointer;font:inherit;font-size:.78rem;padding:5px 11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ok{color:var(--ok);border-color:currentColor;background:transparent}
.att{color:var(--att);border-color:currentColor;background:transparent}
.err{color:var(--err);border-color:currentColor;background:transparent}
.cfg{color:var(--accento);border-color:currentColor;background:var(--accento-tenue)}
.vecchio{border-style:dashed;color:var(--tenue)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg button{flex:0 0 auto;font:inherit;font-size:.86rem;padding:8px 12px;border-radius:999px;border:1px solid var(--linea);background:var(--pannello);color:var(--tenue);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accento-tenue);border-color:var(--accento);color:var(--testo)}
.blocco{background:var(--pannello);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.titolo-grande{font-size:1.4rem;margin:0;font-weight:650;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.meta{font-size:.8rem;color:var(--tenue);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.corpo{font-size:1rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.azioni{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:550;border-radius:10px;padding:9px 14px;border:1px solid var(--accento);background:var(--accento);color:var(--su-accento);cursor:pointer;min-height:42px}
.btn.v{background:transparent;color:var(--accento)}
.btn.r{background:transparent;border-color:var(--err);color:var(--err)}
.btn:disabled{opacity:.45}
.stato{font-size:.86rem;min-height:1.2em}
.stato.ok{color:var(--ok)} .stato.err{color:var(--err)} .stato.att{color:var(--att)}
.banner{font-size:.88rem;padding:10px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--pannello);display:grid;gap:4px}
.banner.err{border-color:var(--err)} .banner.att{border-color:var(--att)} .banner.ok{border-color:var(--ok)}
.banner.err b{color:var(--err)} .banner.att b{color:var(--att)} .banner.ok b{color:var(--ok)}
.mappa{position:relative;height:min(62vh,540px);background:var(--pannello);border:1px solid var(--linea);border-radius:14px;overflow:hidden;touch-action:none}
.mappa canvas{width:100%;height:100%;display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:grid;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:1px solid var(--linea);background:var(--rilievo);color:var(--testo);font-size:1.2rem;cursor:pointer}
.scheda-nodo{position:absolute;left:10px;right:62px;bottom:10px;background:var(--rilievo);border:1px solid var(--linea);border-radius:12px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.scheda-nodo b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--tenue)}
.legenda span{display:flex;gap:5px;align-items:center}
.agente{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--accento-tenue);color:var(--accento);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:0 0 34px}
.attivita{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--linea)}
.attivita:first-child{border-top:none}
.attivita input{width:22px;height:22px;accent-color:var(--accento);flex:0 0 22px}
.attivita span{flex:1;min-width:0;overflow-wrap:anywhere}
.attivita.fatta span{color:var(--tenue);text-decoration:line-through}
.x{background:transparent;border:none;color:var(--tenue);font-size:1.1rem;width:36px;height:36px;cursor:pointer}
label{font-size:.8rem;color:var(--tenue);display:grid;gap:4px}
input,select,textarea{font:inherit;color:var(--testo);background:var(--rilievo);border:1px solid var(--linea);border-radius:10px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;color:var(--testo);font-size:.92rem}
.check input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--accento)}
.scelte{display:grid;gap:4px;max-height:220px;overflow:auto;background:var(--rilievo);border:1px solid var(--linea);border-radius:10px;padding:8px 10px}
.riga2{display:flex;gap:8px;flex-wrap:wrap}.riga2 > *{flex:1 1 150px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem}.kv dt{color:var(--tenue)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.confronto{display:grid;gap:8px}
.confronto pre{margin:0;font-family:var(--m);font-size:.74rem;background:var(--rilievo);border:1px solid var(--linea);border-radius:8px;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}
ol.guida{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.88rem}
details.blocco summary{cursor:pointer;color:var(--tenue)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--pannello);border-top:1px solid var(--linea)}
.nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:grid;justify-items:center;gap:2px;padding:9px 0 8px;color:var(--tenue);text-decoration:none;font-size:.7rem}
.nav a[aria-current="page"]{color:var(--accento)}
.fab{position:fixed;z-index:7;right:max(16px,calc(50% - 320px + 16px));bottom:74px;width:56px;height:56px;border-radius:16px;border:none;background:var(--accento);color:var(--su-accento);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.foglio{position:fixed;inset:0;z-index:20;background:rgba(8,9,11,.65);display:flex;align-items:flex-end;justify-content:center}
.foglio > form{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--pannello);border-top:1px solid var(--linea);border-radius:18px 18px 0 0;padding:16px;display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;z-index:30;background:var(--rilievo);border:1px solid var(--linea);border-radius:12px;padding:10px 14px;font-size:.88rem;max-width:calc(100% - 32px)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accento);outline-offset:2px}

/* ---------- 1.5: tema spaziale ---------- */
html{background:var(--bg)}
body{background:radial-gradient(120% 70% at 85% -10%,rgba(124,92,255,.32),transparent 60%),radial-gradient(90% 60% at -10% 30%,rgba(40,140,255,.20),transparent 65%),radial-gradient(80% 50% at 60% 110%,rgba(200,80,255,.16),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.75;
  background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 140px 80px,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 90px 160px,#c9d2ff,transparent),radial-gradient(1px 1px at 230px 120px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 300px 40px,#9fe6ff,transparent),radial-gradient(1.2px 1.2px at 60px 250px,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 270px 260px,#e2d8ff,transparent);
  background-size:320px 300px}
main{position:relative;z-index:1}.top{z-index:5}
.top{background:rgba(4,5,15,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
.top h1{font-weight:700;letter-spacing:.01em;background:linear-gradient(90deg,#fff,#c8c0ff 55%,var(--accento2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{color:#aab3e6;letter-spacing:.14em}
h2::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accento2);box-shadow:0 0 8px var(--accento2);margin-right:8px;vertical-align:1px}
.blocco,.lista,.cerca,.rapido,.banner,.mappa,.scelte{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--alone)}
.lista{background:var(--linea)}
.riga{background:rgba(14,17,42,.78)}
.riga:active{background:rgba(48,52,110,.8)}
.rapido{background:linear-gradient(160deg,rgba(40,44,100,.55),rgba(14,16,40,.7));border-color:rgba(140,150,255,.22)}
.rapido b{font-size:1.55rem;text-shadow:0 0 14px currentColor}
.punto{box-shadow:0 0 8px currentColor,0 0 2px currentColor}
.btn{background:linear-gradient(135deg,var(--accento),#6e7dff 60%,var(--accento2));border:none;color:#fff;box-shadow:0 0 18px rgba(124,108,255,.45)}
.btn.v{background:rgba(124,108,255,.08);border:1px solid rgba(155,140,255,.45);color:#d6d0ff;box-shadow:none}
.btn.r{background:transparent;border:1px solid var(--err);color:var(--err);box-shadow:none}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,rgba(124,108,255,.35),rgba(90,209,255,.22));border-color:rgba(155,140,255,.7);box-shadow:0 0 14px rgba(124,108,255,.35)}
.nav{background:rgba(6,8,24,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav a[aria-current="page"]{color:#fff;text-shadow:0 0 10px var(--accento)}
.nav a[aria-current="page"] svg{stroke:var(--accento2);filter:drop-shadow(0 0 6px var(--accento2))}
.fab{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#c9c0ff 12%,var(--accento) 45%,#3a2fb8 100%);color:#fff;box-shadow:0 0 0 6px rgba(124,108,255,.14),0 0 30px rgba(124,108,255,.7)}
.foglio{background:rgba(2,3,12,.7);backdrop-filter:blur(6px)}
.foglio > form{background:linear-gradient(180deg,rgba(26,28,70,.96),rgba(10,12,32,.98));border-top:1px solid rgba(155,140,255,.35)}
.chip{background:rgba(30,34,78,.6)}
.toast{background:rgba(26,28,70,.95);box-shadow:0 0 24px rgba(124,108,255,.4)}
.pronte{display:grid;gap:8px}
.pronta summary{display:grid;gap:2px;list-style:none}
.pronta summary::-webkit-details-marker{display:none}
.pronta[open]{border-color:rgba(255,184,92,.45);box-shadow:0 0 22px rgba(255,184,92,.12),var(--alone)}
.risposta{border-left:2px solid var(--accento2);padding:6px 10px;background:rgba(90,209,255,.06);border-radius:0 8px 8px 0}
/* mappa cosmica */
.mappa{height:min(68vh,580px);background:radial-gradient(circle at 50% 45%,rgba(60,50,160,.35),rgba(4,5,15,.2) 60%),rgba(4,5,15,.6);border-color:rgba(140,150,255,.22)}
.zoom button{background:rgba(20,22,56,.8);border-color:var(--linea);backdrop-filter:blur(8px)}
.scheda-nodo{left:auto;right:10px;top:10px;bottom:auto;width:min(260px,calc(100% - 20px));display:grid;gap:6px;background:rgba(10,12,32,.88);border:1px solid rgba(155,140,255,.3);box-shadow:0 0 26px rgba(124,108,255,.25);backdrop-filter:blur(12px)}
.scheda-nodo .tipo{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accento2)}
.scheda-nodo .num{display:flex;gap:18px;font-size:.78rem;color:var(--tenue)}.scheda-nodo .num b{display:block;font-size:1.2rem;color:var(--testo);white-space:normal}
.scheda-nodo ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;max-height:120px;overflow:auto}
.scheda-nodo li button{width:100%;text-align:left;background:rgba(40,44,100,.45);border:1px solid var(--linea);border-radius:8px;color:var(--testo);font:inherit;font-size:.8rem;padding:5px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modi{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(10,12,32,.8);border:1px solid var(--linea);border-radius:999px;padding:4px;backdrop-filter:blur(10px)}
.modi button{font:inherit;font-size:.78rem;border:none;border-radius:999px;padding:6px 12px;background:transparent;color:var(--tenue);cursor:pointer}
.modi button[aria-pressed="true"]{background:rgba(124,108,255,.35);color:#fff}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="ico" id="indietro" aria-label="Indietro" hidden><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1 id="titolo">Second Brain</h1>
  <span class="chip" id="chip-sync">avvio…</span>
  <a class="ico" href="#impostazioni" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.5 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></a>
</div></header>
<main id="vista"></main>
<button class="fab" id="fab" aria-label="Aggiunta rapida"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav" aria-label="Sezioni"><div>
  <a href="#home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#organizza"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12"/></svg>Organizza</a>
  <a href="#note"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Note</a>
  <a href="#mappa"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l7.6 1M7.3 8.2l3.6 7.6M16.9 10.2l-3.7 5.8"/></svg>Mappa</a>
  <a href="#stanze"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>Stanze</a>
</div></nav>
<div class="foglio" id="foglio" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="motore.js"></script>
<script src="globo.js"></script>
<script>
(() => {
  "use strict";
  const M = window.SBMotore;
  const OWNER = "salvatorevirgillito04-code", REPO = "second-brain";
  const FRESCO_MIN = 15;
  const CAT = { inbox: ["Da organizzare", "--inbox"], area: ["Aree", "--area"], risorsa: ["Risorse", "--risorsa"], archivio: ["Archivio", "--archivio"] };
  const BUCKET = { WORKING: ["in esecuzione", "ok"], BLOCKED: ["attende te", "att"], REVIEW_READY: ["pronta per revisione", "ok"], COMPLETED: ["completata", ""], FAILED: ["fallita", "err"], IDLE: ["inattiva", ""] };
  const $ = (s) => document.querySelector(s);
  const V = $("#vista");
  const A = window.Android || null;
  const S = { stato: M.statoVuoto(), origine: "nuovo", erroreArchivio: null, migrazione: null, inSync: false, timerSync: null,
    cerca: "", cercaNote: "", org: "inbox", sub: "stanze", nota: null, stanza: null, progetto: null, nodo: null, isolati: false, pending: null };

  // ---------- utilità ----------
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const ora = () => new Date().toISOString();
  const nuovoId = (p) => p + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  const L = (c) => M.elenco(S.stato, c);
  const T = (c, id) => (id ? M.trova(S.stato, c, id) : null);

  const TITOLI = { home: "Second Brain", organizza: "Organizza", note: "Note", nota: "Nota", progetto: "Progetto", mappa: "Mappa", stanze: "Stanze", stanza: "Stanza", impostazioni: "Impostazioni" };

      $("#b-routines").onclick = () => A && A.apriLink("https://claude.ai/code/routines");
      const via = $("#b-routine-via"); if (via) via.onclick = (e) => conferma(e.currentTarget, () => { A.rimuoviRoutine(); F.hidden = true; render(); toast("Token dell'attività rimosso dal telefono."); });
    },
    token() {
      foglio(`<h2>Accesso GitHub</h2><p class="small">${haToken() ? "Un token è salvato cifrato su questo telefono." : "Nessun token: la sincronizzazione è spenta."}</p>
        <ol class="guida"><li>Tocca <b>Apri GitHub</b> (accedi se richiesto).</li><li>Nome «Second Brain telefono», scadenza 90 giorni.</li><li><i>Repository access</i>: <b>Only select repositories → second-brain</b>.</li><li><i>Repository permissions → Contents</i>: <b>Read and write</b>. Nient'altro.</li><li><i>Generate token</i>, copia (inizia con <span class="mono">github_pat_</span>) e incolla qui.</li></ol>
        <div class="azioni"><button type="button" class="btn v" id="b-github">Apri GitHub</button>${haToken() ? `<button type="button" class="btn r" id="b-token-via">Rimuovi token</button>` : ""}</div>
        <label>Token <input type="password" id="token" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" required></label>`, async () => {
        const v = $("#token").value.trim(); $("#token").value = "";
        const r = A ? A.impostaToken(v) : "anteprima"; if (r !== "ok") throw new Error(r);
        if (!inRete()) return "Token salvato. Verrà verificato alla prima sincronizzazione.";
        const res = await api.richiesta("GET", `/repos/${OWNER}/${REPO}`);
        // permissions.push descrive il tuo account, non il token: la scrittura si verifica solo provando a scrivere
        if (res.status === 200) { setTimeout(() => sincronizza(true), 50); return "Lettura verificata. La scrittura viene verificata dalla sincronizzazione appena avviata."; }
        if (res.status === 401) return "Token non valido o scaduto.";
        if (res.status === 404) return "Il token non dà accesso a second-brain.";
        return "Verifica non riuscita (" + res.status + "): riprova la sincronizzazione.";
      });
      $("#b-github").onclick = () => A && A.apriLink("https://github.com/settings/personal-access-tokens/new");
      const via = $("#b-token-via"); if (via) via.onclick = (e) => conferma(e.currentTarget, () => { A.rimuoviToken(); F.hidden = true; render(); toast("Token rimosso. Revocalo anche su GitHub se non serve più."); });
    },
  };
  $("#fab").onclick = () => EDITOR.rapido();

  // ---------- azioni ----------
  const BLOCCHI = {
    stanze: (id) => L("note").filter((n) => n.stanza_id === id).length + L("progetti").filter((p) => p.stanza_id === id).length + collegamentiDi("stanza_id", id).length ? "La stanza ha note, progetti o esecuzioni collegate: archiviala o sposta prima i collegamenti." : null,
    agenti: (id) => L("stanze").some((s) => (s.agenti_ids || []).includes(id)) || collegamentiDi("agente_id", id).length ? "L'agente è assegnato a stanze o collegato a esecuzioni: rimuovi prima le assegnazioni." : null,
    skill: (id) => L("agenti").some((a) => (a.skill_ids || []).includes(id)) ? "La skill è usata da un agente: toglila prima dalla sua scheda." : null,
    progetti: (id) => L("note").some((n) => n.progetto_id === id) ? "Il progetto ha note collegate: archivialo o scollega prima le note." : null,
  };
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button,[data-apri]"); if (!b || F.contains(b)) return;
    const d = b.dataset;
    if (d.apri) { e.preventDefault(); apri(d.apri, d.id); return; }
    if (d.org) { S.org = d.org; if (d.vai) vai(d.vai); else render(); return; }
    if (d.sub) { S.sub = d.sub; if (d.vai) vai(d.vai); else render(); return; }
    if (d.vai) { vai(d.vai); return; }
    if (d.modifica) { EDITOR[d.modifica](d.id || ""); return; }
    if (d.elimina) { conferma(b, () => { const blocco = BLOCCHI[d.elimina] && BLOCCHI[d.elimina](d.id); if (blocco) { toast(blocco); return; } elimina(d.elimina, d.id); if (["note", "progetti", "stanze"].includes(d.elimina) && NAV[vistaCorrente()]) history.back(); else render(); }); return; }
    if (d.creaDaLink) {
      const nid = await scrivi("note", "", { titolo: d.creaDaLink, testo: d.creaDaLink, tipo: "originale", fonte: "creata da un collegamento", data: ora(), registrato_il: ora(), categoria: "inbox", tag: [], collegamenti: [], accessibile_agenti: false });
      const corrente = T("note", S.nota); await scrivi("note", S.nota, { collegamenti: [...new Set([...(corrente.collegamenti || []), nid])] });
      render(); toast("Nota «" + d.creaDaLink + "» creata e collegata"); return;
    }
    if (d.categoria) { await scrivi("note", S.nota, { categoria: d.categoria }); render(); toast("Spostata in " + CAT[d.categoria][0]); return; }
    if (d.archiviaStanza) { const s = T("stanze", d.archiviaStanza); const arch = statoStanza(s) !== "archiviata"; await scrivi("stanze", s.id, { stato: arch ? "archiviata" : "attiva", archiviata: arch }); render(); return; }
    if (d.archiviaProgetto) { const p = T("progetti", d.archiviaProgetto); await scrivi("progetti", p.id, { stato: p.stato === "archiviato" ? "attivo" : "archiviato" }); render(); return; }
    if (d.attVia) { const s = T("stanze", S.stanza); await scrivi("stanze", s.id, { attivita: (s.attivita || []).filter((a) => a.id !== d.attVia) }); render(); return; }
    if (d.collega) {
      const ag = document.querySelector(`[data-link-ag="${CSS.escape(d.collega)}"]`).value, st = document.querySelector(`[data-link-st="${CSS.escape(d.collega)}"]`).value;
      if (!ag && !st) { stato("#lv-stato", "Scegli almeno un agente o una stanza.", "att"); return; }
      await scrivi("collegamenti", "", { session_id: d.collega, agente_id: ag || null, stanza_id: st || null }); render(); toast("Collegamento salvato"); return;
    }
    if (d.risolvi) { await M.risolviConflitto(S.stato, d.id, d.risolvi); await salva(); render(); programmaSync(); toast("Conflitto risolto"); return; }
    if (d.copia) { try { await navigator.clipboard.writeText(d.copia); toast("Risposta copiata: incollala nella sessione"); } catch (_) { toast("Copia non riuscita: tieni premuto sul testo per copiarlo"); } return; }
    if (d.sessione) { if (A) A.apriLink(d.sessione); return; }
    if (b.id === "b-auto") { S.stato.impostazioni ||= {}; S.stato.impostazioni.auto_organizza = S.stato.impostazioni.auto_organizza === false; if (S.stato.impostazioni.auto_organizza) { const e = await M.organizzaAutomatico(S.stato); toast(`Organizzate ${e.note} note, ${e.stanze} stanze nuove`); } await salva(); render(); return; }
    if (b.id === "b-sync") { sincronizza(true); return; }
    if (b.id === "b-rimanda") { S.stato.impostazioni ||= {}; S.stato.impostazioni.chat_rimandato_fino = new Date(Date.now() + 7 * 86400000).toISOString(); await salva(); render(); toast("Te lo ricordo tra 7 giorni"); return; }
    if (b.id === "b-aggiorna-ora") { aggiornaOra(); return; }
    if (b.id === "b-notifiche") { if (A && A.richiediNotifiche) A.richiediNotifiche(); return; }
    if (b.id === "b-snap") { scaricaIstantanea(); return; }
    if (b.id === "b-exp") { esporta(); return; }
    if (b.id === "b-imp") { if (A) { stato("#imp-stato", "Scegli il file…"); A.importa(); } return; }
    if (b.id === "b-imp-ok") { ripristina(b); return; }
    if (b.id === "b-chat") { if (A) { stato("#chat-stato", "Scegli lo ZIP o conversations.json…"); A.importaFile(); } return; }
    if (b.id === "b-chat-ok") { importaChat(b); return; }
    if (b.id === "b-fitt") { conferma(b, async () => { const n = await M.eliminaFittizi(S.stato); await salva(); programmaSync(); render(); toast(`Eliminati ${n} elementi di prova; i dati reali sono rimasti.`); }); return; }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.dataset.att) { const s = T("stanze", S.stanza); await scrivi("stanze", s.id, { attivita: (s.attivita || []).map((a) => (a.id === e.target.dataset.att ? { ...a, fatta: e.target.checked, fatta_il: e.target.checked ? ora() : null } : a)) }); render(); }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "cerca") { S.cerca = e.target.value; render(); } if (e.target.id === "cerca-note") { S.cercaNote = e.target.value; render(); } });
  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "f-att") return; e.preventDefault();
    const t = $("#att-testo").value.trim(); if (!t) return; const s = T("stanze", S.stanza);
    await scrivi("stanze", s.id, { attivita: [...(s.attivita || []), { id: nuovoId("at"), testo: t, fatta: false, creato_il: ora() }] }); render(); const el = $("#att-testo"); if (el) el.focus();
  });

  // ---------- sincronizzazione ----------
  async function sincronizza(manuale) {
    if (S.inSync || bloccato()) return;
    if (!haToken()) { if (manuale) stato("#sync-stato", "Configura prima l'accesso GitHub.", "att"); return; }
    if (!inRete()) { S.stato.sync.errore = { tipo: "rete", messaggio: "Rete assente: le modifiche restano sul telefono e verranno inviate più tardi.", quando: ora() }; await salva(); render(); if (manuale) stato("#sync-stato", "Rete assente: riprova quando sei connesso.", "att"); return; }
    S.inSync = true; chipSync();
    try {
      const e = await M.sincronizza(S.stato, api, { owner: OWNER, repo: REPO, salva });
      const parti = [`${e.inviati} inviati`, `${e.ricevuti} ricevuti`];
      if (e.eliminati_remoto) parti.push(`${e.eliminati_remoto} tolti dal repository`);
      if (e.eliminati_locale) parti.push(`${e.eliminati_locale} tolti qui perché eliminati nel repository`);
      if (e.conflitti_nuovi) parti.push(`${e.conflitti_nuovi} conflitti da risolvere`);
      const visti = M.interventiDaNotificare(S.stato); if (visti.length) { M.segnaNotificati(S.stato, visti); await salva(); } // l'app è aperta: li vedi qui, niente notifica dopo
      S.esitoSync = ["Sincronizzato: " + parti.join(", ") + (e.ramo_creato ? ". Creato il ramo «dati»." : "."), e.conflitti_nuovi ? "att" : "ok"];
    } catch (err) { S.esitoSync = [err.message || String(err), err.tipo === "rete" ? "att" : "err"]; if (manuale) toast(S.esitoSync[0]); }
    finally { S.inSync = false; if (!F.hidden) chipSync(); else render(); if (S.esitoSync) stato("#sync-stato", ...S.esitoSync); }
  }
  function programmaSync() { clearTimeout(S.timerSync); if (haToken()) S.timerSync = setTimeout(() => sincronizza(false), 20000); }
  window.__ripresa = () => {
    // la sincronizzazione in background può aver aggiornato il file: ricarica prima di qualsiasi scrittura
    if (A && !bloccato() && !S.inSync) { const t = A.caricaDati(); if (t && S.testoSalvato && t !== S.testoSalvato) { const c = M.carica(t, null); if (c.stato && c.origine === "principale") { S.stato = c.stato; S.testoSalvato = t; } } }
    if (F.hidden) render(); sincronizza(false);
  };
  async function scaricaIstantanea() {
    if (!haToken()) { stato("#lv-stato", "Configura l'accesso GitHub nelle impostazioni.", "att"); return; }
    if (!inRete()) { stato("#lv-stato", "Rete assente: resta l'ultima istantanea scaricata.", "att"); return; }
    stato("#lv-stato", "Lettura del repository…");
    try { const n = await M.scaricaIstantanea(S.stato, api, { owner: OWNER, repo: REPO }); await salva(); render(); stato("#lv-stato", n ? "Istantanea scaricata dal repository." : "Nel repository non c'è ancora un'istantanea.", n ? "ok" : "att"); }
    catch (e) { stato("#lv-stato", (e.message || e) + " Resta l'istantanea precedente.", "err"); }
  }

  window.__notifiche = (ok) => { render(); toast(ok ? "Notifiche attive: ti avviso quando una sessione attende un tuo intervento." : "Notifiche non consentite: puoi attivarle dalle impostazioni di Android."); };
  window.__apri = (v) => { if (v === "home-rapido") { if (location.hash !== "#home") location.hash = "home"; setTimeout(() => EDITOR.rapido(), 50); } else vai(v); };

  // ---------- avvio dell'attività pianificata di Claude Code ----------
  const avvia = () => new Promise((res) => { const id = "f" + ++seq; attese.set(id, res); A.avviaRoutine(id); });
  async function aggiornaOra() {
    if (!A || !A.haRoutine()) return;
    if (!inRete()) { stato("#lv-stato", "Rete assente: riprova quando sei connesso.", "att"); return; }
    stato("#lv-stato", "Avvio dell'aggiornamento in Claude Code…");
    const r = await avvia();
    const m = { 401: "Token dell'attività non valido o revocato: rigeneralo su claude.ai e inseriscilo di nuovo.", 400: "L'attività è sospesa o la richiesta non è valida: controllala su claude.ai/code/routines.", 403: "Il tuo account non ha accesso a questa funzione.", 404: "Attività non trovata: controlla l'identificativo.", 429: "Troppi avvii nell'ultima ora: riprova più tardi.", 0: "Rete assente o risposta non ricevuta." };
    if (r.status === 200) {
      stato("#lv-stato", "Aggiornamento avviato in Claude Code. L'app scaricherà il risultato tra qualche minuto.", "ok");
      for (const min of [3, 6, 10]) setTimeout(() => { if (!document.hidden) scaricaIstantanea(); }, min * 60000);
    } else stato("#lv-stato", (m[r.status] || "Avvio non riuscito (" + r.status + ").") + (r.corpo && r.corpo.error && r.corpo.error.message ? " Messaggio: «" + String(r.corpo.error.message).slice(0, 160) + "»." : ""), "err");
  }

  // ---------- esporta / ripristina ----------
  window.__esportato = (ok, msg) => stato("#exp-stato", msg, ok ? "ok" : "err");
  async function esporta() {
    const file = await M.creaBackup(S.stato); if (!A) return;
    stato("#exp-stato", "Scegli dove salvare il file…");
    A.esporta("second-brain-" + ora().slice(0, 10) + ".json", JSON.stringify(file, null, 2), "Esportato: " + M.COLLEZIONI_BACKUP.map((c) => file.dati[c].length + " " + c).join(", ") + ". Impronta " + file.hash_sha256.slice(0, 16) + "…");
  }
  window.__importato = async (ok, testo) => {
    const box = $("#imp-anteprima"); if (box) box.innerHTML = ""; S.pending = null;
    if (!ok) { stato("#imp-stato", testo || "Nessun file scelto.", testo ? "err" : ""); return; }
    try {
      const file = JSON.parse(testo); const v = await M.verificaBackup(file); S.pending = file;
      const cols = v.versione === 1 ? M.COLLEZIONI_BACKUP_V1 : M.COLLEZIONI_BACKUP;
      $("#imp-anteprima").innerHTML = `<div class="banner"><b>Backup ${v.versione === 1 ? "della 1.0 " : ""}del ${esc(quando(file.esportato_il))}</b><span>${cols.map((c) => (file.dati[c] || []).length + " " + c).join(", ")}${v.versione === 1 ? " (le memorie diventeranno note identiche)" : ""}</span><span class="mono">impronta ${esc(v.hashFile.slice(0, 16))}… verificata</span><span class="small">I dati del telefono saranno sostituiti.</span><div class="azioni"><button class="btn" id="b-imp-ok">Sostituisci i dati del telefono</button></div></div>`;
      stato("#imp-stato", "File valido. Controlla e conferma.", "ok");
    } catch (e) { stato("#imp-stato", "File non utilizzabile: " + (e.message || e), "err"); }
  };
  async function ripristina(btn) {
    if (!S.pending) return; btn.disabled = true;
    try {
      const base = bloccato() ? M.statoVuoto() : S.stato;
      const r = await M.ripristina(base, S.pending); S.stato = base; S.origine = "ripristinato"; await salva();
      let suDisco = r.hashDopo; if (A) { const c = M.carica(A.caricaDati(), null); suDisco = await M.impronta(M.datiPuliti(c.stato)); }
      const ok = r.identico && suDisco === r.hashAtteso; S.pending = null; render();
      stato("#imp-stato", ok ? `Importazione verificata${r.versione === 1 ? " (backup 1.0: memorie importate come note)" : ""}: impronta ${r.hashAtteso.slice(0, 16)}… corrispondente al file, anche dopo il salvataggio.` : `Attenzione: impronta diversa dopo l'importazione (${suDisco.slice(0, 12)}…). Conserva il file di backup.`, ok ? "ok" : "err");
      programmaSync();
    } catch (e) { stato("#imp-stato", "Ripristino non riuscito: " + (e.message || e) + ". I dati del telefono non sono stati salvati.", "err"); btn.disabled = false; }
  }

  // ---------- importazione chat di Claude ----------
  window.__fileScelto = async (ok, dati) => {
    const box = $("#chat-anteprima"); if (box) box.innerHTML = ""; S.chat = null;
    if (!ok) { stato("#chat-stato", dati || "Nessun file scelto.", dati ? "err" : ""); return; }
    try {
      stato("#chat-stato", "Lettura del file…");
      const bin = atob(dati); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const testo = bytes[0] === 0x50 && bytes[1] === 0x4b ? await M.leggiDaZip(bytes, "conversations.json") : new TextDecoder().decode(bytes);
      const a = M.analizzaChatClaude(JSON.parse(testo));
      const gia = a.chat.filter((c) => T("note", c.id)).length; S.chat = a;
      $("#chat-anteprima").innerHTML = `<div class="banner"><b>${a.chat.length} chat trovate</b><span>${a.chat.length - gia} nuove, ${gia} già importate (non verranno modificate)${a.scartate.length ? `, ${a.scartate.length} scartate perché vuote o non riconosciute` : ""}${a.allegatiIgnorati ? `, ${a.allegatiIgnorati} allegati non importati` : ""}.</span><span class="small">Diventeranno note originali e private in «Da organizzare», con fonte e data. Prima viene salvata una copia dei dati attuali.</span>${a.chat.length - gia ? `<div class="azioni"><button class="btn" id="b-chat-ok">Importa ${a.chat.length - gia} chat</button></div>` : ""}</div>`;
      stato("#chat-stato", "Controlla e conferma.", "ok");
    } catch (e) { stato("#chat-stato", "File non utilizzabile: " + (e.message || e) + " Il formato dell'esportazione di Claude non è documentato: se è cambiato, mandami il messaggio.", "err"); }
  };
  async function importaChat(btn) {
    if (!S.chat || bloccato()) return; btn.disabled = true;
    const copia = A ? A.salvaCopia("prima-importazione-chat-" + ora().replace(/[^0-9]/g, "").slice(0, 14) + ".json", JSON.stringify(S.stato)) : "ok";
    if (copia !== "ok" && copia !== "esiste") { stato("#chat-stato", "Copia di sicurezza non salvata (" + copia + "): importazione annullata.", "err"); btn.disabled = false; return; }
    const e = await M.importaChatClaude(S.stato, S.chat, ora()); await salva(); S.chat = null; render();
    stato("#chat-stato", `Importate ${e.importate} chat come note private.${e.gia_presenti ? ` ${e.gia_presenti} erano già presenti${e.piu_recenti_non_sovrascritte ? `, di cui ${e.piu_recenti_non_sovrascritte} più recenti nell'esportazione: non sovrascritte (elimina la nota e reimporta se vuoi la versione nuova)` : ""}.` : ""}`, "ok");
  }

  // ---------- avvio ----------
  if (A) {
    const t0 = A.caricaDati(); const c = M.carica(t0, A.caricaDatiPrecedenti());
    S.origine = c.origine; S.testoSalvato = t0;
    if (c.origine === "migrazione_fallita") { S.stato = M.statoVuoto(); S.migrazione = c.migrazione; }
    else {
      S.stato = c.stato;
      if (c.migrazione) {
        const copia = A.salvaCopia("dati-1.0-prima-della-migrazione.json", c.testoOriginale);
        S.migrazione = c.migrazione;
        if (copia === "ok" || copia === "esiste") salva();
        else { S.origine = "migrazione_fallita"; S.migrazione = { ...c.migrazione, ok: false, errori: ["copia di sicurezza non salvata: " + copia] }; }
      }
    }
  }
  if (location.hash === "#home-rapido") { history.replaceState(null, "", "#home"); setTimeout(() => EDITOR.rapido(), 50); }
  render();
  if (A && A.aggiornaWidget) try { A.aggiornaWidget(JSON.stringify(M.riepilogoWidget(S.stato))); } catch (_) {}
  setInterval(() => { if (!document.hidden && F.hidden && !document.activeElement.matches("input,textarea,select")) render(); }, 60000);
  if (!bloccato()) sincronizza(false);
})();
</script>
